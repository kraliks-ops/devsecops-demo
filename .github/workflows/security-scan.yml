name: DevSecOps Security Scan

on: [push] # Spustit kontrolu při každé změně kódu

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Stažení kódu repozitáře
        uses: actions/checkout@v4

      - name: Spuštění skeneru zranitelností Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs' # Skenování souborového systému (kód a závislosti)
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH' # Vyhledávání pouze kritických a vysoce závažných hrozeb
